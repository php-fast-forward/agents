name: "Fast Forward Changelog"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      changelog-file:
        description: Path to the managed changelog file.
        required: false
        type: string
        default: CHANGELOG.md
      version:
        description: Optional version to promote during manual release preparation.
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: write
  pull-requests: write
  repository-projects: write

jobs:
  changelog:
    uses: php-fast-forward/.github/.github/workflows/changelog.yml@task/2-extract-shared-workflows
    with:
      automation-ref: task/2-extract-shared-workflows
      changelog-file: ${{ inputs.changelog-file || 'CHANGELOG.md' }}
      dev-tools-version: ^1.0
      version: ${{ inputs.version || '' }}
    secrets: inherit
